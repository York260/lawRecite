<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>警察人員人事條例背誦</title>
<script>
  // 先套用記住的白天／黑夜模式，避免載入時閃一下
  window.__hostTheme = document.documentElement.getAttribute('data-theme');
  try {
    var t = JSON.parse(localStorage.getItem('lawRecite.v1')).prefs.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<!--APP-->
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">背</span>
      <div class="brand-text">
        <strong id="law-name">警察人員人事條例</strong>
        <span id="law-date" class="muted"></span>
      </div>
      <select id="law-select" class="law-select" aria-label="選擇法規" hidden></select>
      <button type="button" id="theme-btn" class="icon-btn theme-btn" aria-label="切換白天／黑夜模式">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.7 14.6A8.5 8.5 0 0 1 9.4 3.3a.8.8 0 0 0-1-1A10 10 0 1 0 21.7 15.6a.8.8 0 0 0-1-1Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"/></svg>
      </button>
    </div>
    <div class="modes" role="tablist" aria-label="練習模式">
      <button type="button" role="tab" id="tab-full" data-mode="full">逐字背誦</button>
      <button type="button" role="tab" id="tab-cloze" data-mode="cloze">關鍵字填空</button>
    </div>
    <nav class="art-nav" aria-label="條文切換">
      <button type="button" id="prev" class="icon-btn" aria-label="上一條">‹</button>
      <select id="art-select" aria-label="選擇條文"></select>
      <button type="button" id="next" class="icon-btn" aria-label="下一條">›</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <div class="seg" id="input-seg" role="radiogroup" aria-label="輸入方式">
      <span class="tool-label">輸入</span>
      <button type="button" data-in="zhuyin" role="radio">注音</button>
      <button type="button" data-in="voice" role="radio">語音</button>
    </div>
    <div class="seg" id="density" role="radiogroup" aria-label="挖空程度">
      <span class="tool-label">挖空</span>
      <button type="button" data-d="1" role="radio">少 <small></small></button>
      <button type="button" data-d="2" role="radio">中 <small></small></button>
      <button type="button" data-d="3" role="radio">多 <small></small></button>
    </div>
    <div class="tool-btns">
      <button type="button" id="review-btn" class="ghost-btn review-btn">複習 0</button>
      <button type="button" id="settings-btn" class="ghost-btn" aria-expanded="false" aria-controls="settings">設定</button>
      <button type="button" id="restart" class="ghost-btn">重來</button>
    </div>
  </div>

  <section class="settings" id="settings" hidden aria-label="設定">
    <div class="set-row">
      <span class="set-label">外觀</span>
      <div class="seg" id="theme-seg" role="radiogroup" aria-label="外觀">
        <button type="button" role="radio" data-theme-opt="auto">跟隨系統</button>
        <button type="button" role="radio" data-theme-opt="light">白天</button>
        <button type="button" role="radio" data-theme-opt="dark">黑夜</button>
      </div>
    </div>
    <div class="set-row" id="layout-row">
      <span class="set-label">鍵盤排列</span>
      <div class="seg" id="layout-seg" role="radiogroup" aria-label="鍵盤排列">
        <button type="button" role="radio" data-layout="dachen">大千（同手機注音）</button>
        <button type="button" role="radio" data-layout="order">ㄅㄆㄇ順序</button>
      </div>
    </div>
    <div class="set-row" id="size-row">
      <span class="set-label">按鍵大小</span>
      <div class="seg" id="size-seg" role="radiogroup" aria-label="按鍵大小">
        <button type="button" role="radio" data-size="m">標準</button>
        <button type="button" role="radio" data-size="l">大</button>
        <button type="button" role="radio" data-size="xl">特大</button>
      </div>
    </div>
    <div class="set-row set-checks">
      <span class="set-label">其他</span>
      <label class="check" id="punct-wrap"><input type="checkbox" id="opt-punct"> 先顯示標點</label>
      <label class="check" id="retry-wrap"><input type="checkbox" id="opt-retry"> 打錯要重打</label>
      <label class="check" id="vibrate-wrap"><input type="checkbox" id="opt-vibrate"> 按鍵震動</label>
      <label class="check kb-toggle" id="kb-wrap"><input type="checkbox" id="opt-kb"> 螢幕鍵盤</label>
    </div>
    <p class="set-note">按鍵是「放開手指才輸入」：按住會放大顯示該注音，按錯可以滑到旁邊的鍵再放開，滑出鍵盤放開則取消。</p>
  </section>

  <div class="review-bar" id="review-bar" hidden>
    <span id="review-pos"></span>
  </div>

  <article class="sheet" id="sheet">
    <div class="sheet-head">
      <div>
        <div class="eyebrow" id="chapter"></div>
        <h1 id="art-title"></h1>
      </div>
      <div class="meter" aria-live="polite">
        <div class="meter-nums"><span id="m-done">0</span> / <span id="m-total">0</span></div>
        <div class="meter-sub"><span class="dot bad"></span>錯 <span id="m-bad">0</span><span class="dot hint"></span>提示 <span id="m-hint">0</span></div>
        <div class="bar"><i id="m-bar"></i></div>
      </div>
    </div>
    <div class="body" id="body"></div>
    <div class="result" id="result" hidden>
      <div class="result-score"><b id="r-pct">0%</b><span id="r-text"></span></div>
      <p class="srs-note" id="r-srs" hidden></p>
      <div class="result-actions" id="result-actions">
        <button type="button" id="r-again" class="ghost-btn">重背這條</button>
        <button type="button" id="r-next" class="primary-btn">下一條 →</button>
      </div>
    </div>
  </article>

  <p class="howto" id="howto">
    每個字只要打<b>第一個注音</b>就會出現；打錯會標成紅底。電腦可直接用大千注音鍵位（1=ㄅ、q=ㄆ、a=ㄇ…），
    <kbd>Backspace</kbd> 退回一字、<kbd>空白鍵</kbd> 提示、<kbd>Enter</kbd> 完成後下一條。
    選「語音」則直接把條文唸出來，唸對的字會出現，同音字也算對；唸錯或漏唸的字標紅底，背完說「下一條」即可換條。
  </p>
</main>

<div class="kb" id="kb" aria-label="注音鍵盤">
  <div id="kb-done" hidden>
  <p class="srs-note kb-srs" id="kb-srs" hidden></p>
  <div class="kb-done">
    <button type="button" id="kb-again" class="ghost-btn">重背這條</button>
    <button type="button" id="kb-next" class="primary-btn">下一條 →</button>
  </div>
  </div>
  <div class="kb-keys" id="kb-keys"></div>
  <div class="kb-voice" id="kb-voice" hidden>
    <div class="v-heard" id="v-heard" aria-live="polite"></div>
    <div class="v-row">
      <button type="button" class="ghost-btn v-side" id="v-hint">提示</button>
      <button type="button" class="mic" id="v-mic" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.59a6 6 0 0 0 5-5.91Z"/></svg>
        <span id="v-label">開始唸</span>
      </button>
      <button type="button" class="ghost-btn v-side" id="v-back" aria-label="退回一字">⌫</button>
    </div>
  </div>
</div>
<div class="key-pop" id="key-pop" aria-hidden="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="data/laws.js"></script>
<script src="data/sounds.js"></script>
<script src="assets/app.js"></script>
<!--/APP-->
</body>
</html>
