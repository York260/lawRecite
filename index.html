<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>警察人員人事條例背誦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<!--APP-->
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">背</span>
      <div class="brand-text">
        <strong id="law-name">警察人員人事條例</strong>
        <span id="law-date" class="muted"></span>
      </div>
      <select id="law-select" class="law-select" aria-label="選擇法規" hidden></select>
    </div>
    <div class="modes" role="tablist" aria-label="練習模式">
      <button type="button" role="tab" id="tab-full" data-mode="full">逐字背誦</button>
      <button type="button" role="tab" id="tab-cloze" data-mode="cloze">關鍵字填空</button>
    </div>
    <nav class="art-nav" aria-label="條文切換">
      <button type="button" id="prev" class="icon-btn" aria-label="上一條">‹</button>
      <select id="art-select" aria-label="選擇條文"></select>
      <button type="button" id="next" class="icon-btn" aria-label="下一條">›</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <div class="density" id="density" role="radiogroup" aria-label="挖空程度">
      <span class="tool-label">挖空</span>
      <button type="button" data-d="1" role="radio">少 <small></small></button>
      <button type="button" data-d="2" role="radio">中 <small></small></button>
      <button type="button" data-d="3" role="radio">多 <small></small></button>
    </div>
    <label class="check" id="punct-wrap"><input type="checkbox" id="opt-punct"> 先顯示標點</label>
    <label class="check"><input type="checkbox" id="opt-retry"> 打錯要重打</label>
    <label class="check kb-toggle"><input type="checkbox" id="opt-kb"> 螢幕鍵盤</label>
    <button type="button" id="restart" class="ghost-btn">重來</button>
  </div>

  <article class="sheet" id="sheet">
    <div class="sheet-head">
      <div>
        <div class="eyebrow" id="chapter"></div>
        <h1 id="art-title"></h1>
      </div>
      <div class="meter" aria-live="polite">
        <div class="meter-nums"><span id="m-done">0</span> / <span id="m-total">0</span></div>
        <div class="meter-sub"><span class="dot bad"></span>錯 <span id="m-bad">0</span><span class="dot hint"></span>提示 <span id="m-hint">0</span></div>
        <div class="bar"><i id="m-bar"></i></div>
      </div>
    </div>
    <div class="body" id="body"></div>
    <div class="result" id="result" hidden>
      <div class="result-score"><b id="r-pct">0%</b><span id="r-text"></span></div>
      <div class="result-actions">
        <button type="button" id="r-again" class="ghost-btn">重背這條</button>
        <button type="button" id="r-next" class="primary-btn">下一條 →</button>
      </div>
    </div>
  </article>

  <p class="howto" id="howto">
    每個字只要打<b>第一個注音</b>就會出現；打錯會標成紅底。電腦可直接用大千注音鍵位（1=ㄅ、q=ㄆ、a=ㄇ…），
    <kbd>Backspace</kbd> 退回一字、<kbd>空白鍵</kbd> 提示、<kbd>Enter</kbd> 完成後下一條。
  </p>
</main>

<div class="kb" id="kb" aria-label="注音鍵盤">
  <div class="kb-done" id="kb-done" hidden>
    <button type="button" id="kb-again" class="ghost-btn">重背這條</button>
    <button type="button" id="kb-next" class="primary-btn">下一條 →</button>
  </div>
  <div class="kb-keys" id="kb-keys"></div>
</div>

<script src="data/laws.js"></script>
<script src="assets/app.js"></script>
<!--/APP-->
</body>
</html>
